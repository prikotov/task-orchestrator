# Конфигурация сервисов модуля GitIdentity.
#
# Следует конвенции docs/conventions/modules/configuration.md: конфигурация
# сервисов модуля лежит в Resource/config/services.yaml, параметры имеют
# префикс module.git_identity.* (а не в общем config/services.yaml).
# Этот файл является единственным владельцем auto-discovery namespace
# TaskOrchestrator\Common\Module\GitIdentity\.

parameters:
  # Каталог модуля. Используется интеграционным тестом ModuleSystemIntegrationTest
  # (проверяет, что параметры services.yaml загружены через ModuleCompilerPass)
  # и является каноническим module-dir параметром по конвенции
  # modules/configuration.md.
  module.git_identity.module_dir: '%task_orchestrator.package_dir%/src/Module/GitIdentity'
  # Каталог кеша токенов. base_path — корень проекта, поэтому дублировать
  # task-orchestrator/ в пути не нужно (раньше было var/cache/task-orchestrator/git-identity).
  module.git_identity.cache_dir: '%task_orchestrator.base_path%/var/cache/git-identity'

  # Транспортные настройки HTTP-клиента для GitHub API (конвенция External Service:
  # таймауты обязательны). Те же env-переменные читает LoadGitIdentityConfigService
  # для доменной конфигурации (GitIdentityConfigVo) — значения остаются согласованными.
  module.git_identity.request_timeout_seconds: '%env(default::30:int:AGENT_REQUEST_TIMEOUT_SECONDS)%'
  module.git_identity.request_max_duration_seconds: '%env(default::60:int:AGENT_REQUEST_MAX_DURATION_SECONDS)%'
  module.git_identity.api_version: '%env(default::2022-11-28:AGENT_GITHUB_API_VERSION)%'
  module.git_identity.user_agent: '%env(default::task-orchestrator-git-identity:AGENT_USER_AGENT)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Auto-discovery сервисов модуля выполняется ModuleServiceRegistrar
  # (PHAR-safe: RecursiveDirectoryIterator вместо Symfony resource:/GlobResource,
  # который не работает по phar:// путям). Explicit defs (aliases, параметры,
  # аргументы) ниже.

  # Scoped HTTP-клиент для GitHub API (конвенция External Service):
  # таймауты и статические заголовки задаются один раз, per-request компонент
  # добавляет только динамический Authorization (bearer).
  http_client.git_identity:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['@http_client', 'withOptions']
    arguments:
      - timeout: '%module.git_identity.request_timeout_seconds%'
        max_duration: '%module.git_identity.request_max_duration_seconds%'
        headers:
          Accept: 'application/vnd.github+json'
          'X-GitHub-Api-Version': '%module.git_identity.api_version%'
          'User-Agent': '%module.git_identity.user_agent%'

  # GitHub HTTP-компонент получает scoped-клиент вместо дефолтного http_client.
  TaskOrchestrator\Common\Module\GitIdentity\Infrastructure\Component\GitHub\GitHubHttpComponent:
    arguments:
      $httpClient: '@http_client.git_identity'

  # Domain Service aliases (Interface → Implementation)
  TaskOrchestrator\Common\Module\GitIdentity\Domain\Service\LoadGitIdentityConfigServiceInterface:
    alias: TaskOrchestrator\Common\Module\GitIdentity\Infrastructure\Service\LoadGitIdentityConfigService
  TaskOrchestrator\Common\Module\GitIdentity\Domain\Service\TokenCacheInterface:
    alias: TaskOrchestrator\Common\Module\GitIdentity\Infrastructure\Service\FilesystemTokenCacheService
  TaskOrchestrator\Common\Module\GitIdentity\Domain\Service\SignJwtTokenServiceInterface:
    alias: TaskOrchestrator\Common\Module\GitIdentity\Infrastructure\Service\OpenSslSignJwtTokenService
  TaskOrchestrator\Common\Module\GitIdentity\Domain\Service\ResolveInstallationIdServiceInterface:
    alias: TaskOrchestrator\Common\Module\GitIdentity\Infrastructure\Service\GitHubResolveInstallationIdService
  TaskOrchestrator\Common\Module\GitIdentity\Domain\Service\RequestInstallationTokenServiceInterface:
    alias: TaskOrchestrator\Common\Module\GitIdentity\Infrastructure\Service\GitHubRequestInstallationTokenService

  # Инфраструктурный интерфейс HTTP-компонента GitHub → единственная реализация
  # (авто-резолвится через GitHubHttpComponent, но alias объявлен явно для
  # детерминированности DI и независимости от порядка auto-discovery).
  TaskOrchestrator\Common\Module\GitIdentity\Infrastructure\Component\GitHub\GitHubHttpComponentInterface:
    alias: TaskOrchestrator\Common\Module\GitIdentity\Infrastructure\Component\GitHub\GitHubHttpComponent

  # Infrastructure Service parameters.
  # LoadGitIdentityConfigService — без аргументов: читает конфиг из env
  # (AGENT_APP_ID, AGENT_PRIVATE_KEY[_PATH] и т.д.) с дефолтами-константами
  # внутри себя, поэтому сюда выносится только скалярный аргумент кеша.
  TaskOrchestrator\Common\Module\GitIdentity\Infrastructure\Service\FilesystemTokenCacheService:
    arguments:
      $cacheDir: '%module.git_identity.cache_dir%'
