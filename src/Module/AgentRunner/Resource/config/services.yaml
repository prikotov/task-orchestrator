# Конфигурация сервисов модуля AgentRunner.

parameters:
  # Канонический module-dir параметр модуля по конвенции modules/configuration.md.
  # PHAR-safe регистратор берёт каталог напрямую из ModuleInterface::getModuleDir()
  # (= __DIR__), поэтому параметр здесь декларативный; сохранён для соответствия
  # конвенции модульной конфигурации.
  module.agent_runner.module_dir: '%task_orchestrator.package_dir%/src/Module/AgentRunner'
  module.agent_runner.platform_family: '%task_orchestrator.platform_family%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Тег agent.runner регистрируется container-wide в Kernel::build через
  # registerForAutoconfiguration (применяется ко всем autoconfigured сервисам),
  # а не module-local _instanceof.

  # Auto-discovery сервисов модуля выполняется ModuleServiceRegistrar
  # (PHAR-safe: RecursiveDirectoryIterator вместо Symfony resource:/GlobResource,
  # который не работает по phar:// путям). Explicit defs (aliases, параметры,
  # аргументы) ниже.

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\Pi\PiAgentRunnerService

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\PiAgentRunnerServiceInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\Pi\PiAgentRunnerService

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerRegistryServiceInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerRegistryService

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\MetricsCollectorInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\Metrics\InMemoryMetricsCollectorService

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\RetryableRunnerFactoryInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\RetryableRunnerFactory

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerRegistryService:
    arguments:
      $runners: !tagged_iterator agent.runner

  TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\Lifecycle\RunAgentProcessLifecycleServiceInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\Lifecycle\RunAgentProcessLifecycleService

  TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcessLivenessProbeComponentInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcessLivenessProbeComponent

  TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcessLivenessProbeComponent:
    arguments:
      $platformFamily: '%module.agent_runner.platform_family%'
      $linuxProcfsProbe: '@TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcessLivenessProbeLinuxProcfsComponent'
      $unavailableProbe: '@TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcessLivenessProbeUnavailableComponent'

  TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcFilesystemComponentInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcFilesystemComponent

  TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcessLivenessClockComponentInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcessLivenessClockComponent

  TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcessLivenessSleeperComponentInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcessLivenessSleeperComponent

when@test:
  services:
    TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcFilesystemComponentInterface:
      alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Component\ProcessLiveness\ProcFilesystemComponent
      public: true
