name: Secret Scan PR Content

# Сканирует PR-body, PR-title и PR-comments на утечки секретов.
#
# Зачем: GitHub Push Protection ловит секреты в git-push (commits/blobs),
# а GitHub Secret Scanning поднимает alert事后. Но НИ ТО, НИ ДРУГОЕ не ловит
# секреты, вставленные через редактирование PR-body / PR-comment через
# GitHub API (gh pr edit --body, web-UI edit) — этот контент живёт вне git.
# Этот workflow закрывает gap: гоняет gitleaks на API-контент PR.
#
# Срабатывает на: открытие/редактирование PR + новые/отредактированные comments.
# Гарантирует: секрет не пролезет в PR-body даже в обход git-push hooks.

on:
  pull_request:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan-pr-content:
    # Только для PR-событий (issue_comment/pr_review_comment срабатывают и на issue-комменты,
    # но нас интересуют только связанные с PR — фильтруем ниже).
    if: github.event_name == 'pull_request' || github.event.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (для .gitleaks.toml)
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Collect PR content (body, title, comments)
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p scan
          {
            echo "# PR title"
            echo ""
            echo "${{ github.event.pull_request.title }}"
            echo ""
            echo "# PR body"
            echo ""
            echo "${{ github.event.pull_request.body }}"
          } > scan/pr-meta.txt

          # Comments: PR-review comments + issue-style comments on the PR.
          PR_NUMBER="${{ github.event.pull_request.number }}"
          {
            echo "# PR comments"
            echo ""
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq '.[].body' 2>/dev/null || true
            echo ""
            echo "# PR review comments"
            echo ""
            gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments" \
              --jq '.[].body' 2>/dev/null || true
          } >> scan/pr-meta.txt

          echo "content-collected=true" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks on PR content
        id: scan
        run: |
          set -euo pipefail
          # --no-git: сканируем файл как plain text (не git-историю).
          # -v: показать findings в логе CI (для разбора).
          # --redact: не печатать сам секрет в логе (чтобы CI-лог не стал новым leak-source).
          if gitleaks detect --no-banner --no-git --redact --config .gitleaks.toml --source scan/pr-meta.txt > finding.log 2>&1; then
            echo "secret-found=false" >> "$GITHUB_OUTPUT"
            echo "✅ No secrets in PR content"
          else
            # gitleaks exit 1 = leaks found; любые другие exit — ошибка сканера.
            ec=$?
            if [ "$ec" -eq 1 ]; then
              echo "secret-found=true" >> "$GITHUB_OUTPUT"
              echo "🔴 Secret detected in PR content (redacted):"
              cat finding.log
              exit 1
            else
              echo "secret-found=scanner-error" >> "$GITHUB_OUTPUT"
              echo "⚠️ gitleaks scanner error (exit $ec):"
              cat finding.log
              exit "$ec"
            fi
          fi

      - name: Comment on PR if secret found
        if: failure() && steps.scan.outputs.secret-found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          gh pr comment "$PR_NUMBER" --body "🔴 **Secret Scan PR Content**: обнаружен секрет в PR-body/title/comment. GitHub Push Protection не покрывает API-редактирование PR, поэтому этот CI ловит gap. Уберите секрет (используйте \`<REDACTED>\`), перевыпустите его при необходимости, и обновите PR. [Лог CI](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — секреты в логе отредактированы (redacted)."
