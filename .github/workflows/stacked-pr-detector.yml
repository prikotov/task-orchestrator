name: Stacked PR Detector

# Детектор запрета стековых PR (правило AGENTS.md, раздел «Pull Request»).
# Пилот в информирующем режиме: нарушение не красит job, а доносится
# PR-комментарием и summary; «невозможно проверить» — всегда красный.
# Контракт: docs/agents/reports/system-architect-gandalf/2026-10-26_14-26_stacked-pr-detector-contract.md
#
# Безопасность (раздел 14 контракта):
# - pull_request_target не используется (исполняет код из PR с секретами);
# - checkout в detect/comment — ТОЛЬКО из доверенной base-ветки PR;
# - код из PR исполняется лишь в detector-tests — без токенов и секретов;
# - контент PR не интерполируется в shell: данные идут gh api → файл → python;
# - права: contents:read + pull-requests:read; write — точечно в job comment.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  detector-tests:
    name: Detector synthetic tests
    runs-on: ubuntu-latest
    steps:
      # Обычный checkout (код PR): синтетические тесты детектора без секретов
      # проверяют изменения детектора из самого PR до job детекции.
      - uses: actions/checkout@v4
      - name: Run detector tests (python3 stdlib, без сети и секретов)
        run: make tests-detector

  detect:
    name: Detect stacked PR
    needs: detector-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v4
        with:
          # Код детектора — только из доверенной базовой ветки (раздел 14).
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Detect
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          DETECTOR_MODE: inform
        run: |
          set -uo pipefail
          # Без set -e: даже при «красном» коде возврата (enforce-нарушение 3,
          # inconclusive 2) шаг обязан записать outputs — иначе job comment не
          # увидит вердикт (контракт, раздел 8: нарушение → PR-комментарий
          # в обоих режимах).
          code=0
          bin/stacked-pr-detector detect \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --mode "$DETECTOR_MODE" \
            --output verdict.json || code=$?
          # Вердикт читаем из файла (не из stdout): исход outcome — enum.
          outcome=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["verdict"]["outcome"])' verdict.json)
          has_notes=$(python3 -c 'import json,sys; print("true" if json.load(open(sys.argv[1]))["verdict"]["notes"] else "false")' verdict.json)
          {
            echo "outcome=$outcome"
            echo "has_notes=$has_notes"
          } >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Store verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stacked-pr-detector-verdict
          retention-days: 7
          path: verdict.json

  comment:
    name: Comment on PR
    needs: detect
    # Нарушение — комментарий по разделу 8 контракта (в обоих режимах:
    # при enforce job detect красный, но вердикт записан в outputs);
    # чистый PR с заметкой случая B (цель — исходная ветка открытого PR) —
    # информирование по разделу 6: заметка не замалчивается.
    if: >-
      !cancelled() &&
      (needs.detect.outputs.outcome == 'violation' ||
       (needs.detect.outputs.outcome == 'clean' && needs.detect.outputs.has_notes == 'true'))
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Download verdict
        uses: actions/download-artifact@v4
        with:
          name: stacked-pr-detector-verdict

      - name: Publish or update detector comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bin/stacked-pr-detector comment \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --report verdict.json
