# Release Phar
#
# При пуше тега v* (например, v1.0.0) собирает task-orchestrator.phar
# и прикрепляет его к GitHub Release.
#
# Как работает:
#   1. Проверяет Composer-host distribution smoke
#   2. Запускает liveness smoke с Node worker и exact php:8.4.1-cli без procps/pcntl
#   3. Запускает официальный контейнер PHP 8.4.1 и проверяет PHP_VERSION_ID
#   4. composer install (без dev-зависимостей)
#   5. composer check-platform-reqs --no-dev
#   6. PHAR_SMOKE_KEEP_ARTIFACT=1 make phar-smoke:
#      - box compile --config=box.json.dist → task-orchestrator.phar
#      - version/commands/agent:init smoke в изолированном временном state
#      - успешно проверенный task-orchestrator.phar сохраняется для upload
#   7. Загрузка task-orchestrator.phar в assets релиза
#
# Ошибка проверки платформы, сборки или smoke-теста блокирует публикацию Phar asset.
# Box установлен как standalone tool через setup-php (не через Composer,
# т.к. humbug/box конфликтует с Symfony 8.x).

name: Release Phar

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-phar:
    runs-on: ubuntu-latest
    name: Build & publish Phar

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-php stages the tool PHARs only. The runtime contract is checked
      # inside the official PHP 8.4.1 container below.
      - name: Stage Composer and Box for the container
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, box

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer install --no-interaction --prefer-dist

      - name: Smoke-test Composer host distribution
        run: make composer-host-smoke

      - name: Linux liveness smoke with Node worker and exact PHP 8.4.1
        run: make liveness-smoke

      - name: Verify production contract and smoke-test Phar on exact PHP 8.4.1
        shell: bash
        run: |
          set -euo pipefail

          composer_bin="$(readlink -f "$(command -v composer)")"
          box_bin="$(readlink -f "$(command -v box)")"

          docker run --rm \
            --env PHAR_SMOKE_KEEP_ARTIFACT=1 \
            --env GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${composer_bin}:/opt/tools/composer:ro" \
            --volume "${box_bin}:/usr/local/bin/box:ro" \
            --workdir /workspace \
            docker.io/library/php:8.4.1-cli \
            bash -euo pipefail -c '
              actual_version_id="$(php -r "echo PHP_VERSION_ID;")"
              if ! php -r "exit(PHP_VERSION_ID === 80401 ? 0 : 1);"; then
                actual_version="$(php -r "echo PHP_VERSION;")"
                echo "ERROR: Expected PHP_VERSION_ID=80401, got ${actual_version_id} (${actual_version})." >&2
                exit 1
              fi

              php --version
              apt-get update
              apt-get install --yes --no-install-recommends unzip
              rm -rf /var/lib/apt/lists/*
              ln --symbolic /opt/tools/composer /usr/local/bin/composer
              # Запечь release tag в Composer-метаданные через штатный
              # COMPOSER_ROOT_VERSION, чтобы упакованный PHAR сообщал точную
              # SemVer через InstalledVersions::getRootPackage()['pretty_version'].
              # COMPOSER_ROOT_VERSION — это официальный документированный механизм
              # Composer для override версии root package без модификации
              # composer.json (в отличие от `composer config version`, который
              # мутирует файл и выдаёт предупреждение «could not detect the root
              # package version»). Значение запекается в сгенерированный
              # vendor/composer/InstalledVersions.php на этапе install и попадает
              # в PHAR вместе с vendor/.
              release_version="${GITHUB_REF_NAME#v}"
              if ! bin/phar-smoke --internal-validate-release-version "${release_version}"; then
                echo "ERROR: ref ${GITHUB_REF_NAME} is not a release tag." >&2
                exit 1
              fi
              export COMPOSER_ROOT_VERSION="${release_version}"
              php /opt/tools/composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
              php /opt/tools/composer check-platform-reqs --no-dev
              export PHAR_EXPECTED_VERSION="${release_version}"
              make phar-smoke
            '

      - name: Verify release Phar asset
        run: test -s task-orchestrator.phar

      - name: Upload Phar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: task-orchestrator.phar
