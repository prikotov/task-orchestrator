# Release Phar
#
# При пуше тега v* (например, v1.0.0) собирает task-orchestrator.phar
# и прикрепляет его к GitHub Release.
#
# Как работает:
#   1. composer install (без dev-зависимостей)
#   2. PHAR_SMOKE_KEEP_ARTIFACT=1 make phar-smoke:
#      - box compile --config=box.json.dist → task-orchestrator.phar
#      - version/commands/agent:init smoke в изолированном временном state
#      - успешно проверенный task-orchestrator.phar сохраняется для upload
#   3. Загрузка task-orchestrator.phar в assets релиза
#
# Ошибка сборки или smoke-теста блокирует публикацию Phar asset.
# Box установлен как standalone tool через setup-php (не через Composer,
# т.к. humbug/box конфликтует с Symfony 8.x).

name: Release Phar

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-phar:
    runs-on: ubuntu-latest
    name: Build & publish Phar

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: box

      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Smoke-test Composer host distribution
        run: make composer-host-smoke

      - name: Build and smoke-test release Phar
        run: make phar-smoke
        env:
          # bin/phar-smoke удаляет локальный test artifact по умолчанию.
          # Release workflow явно сохраняет только успешно проверенный PHAR.
          PHAR_SMOKE_KEEP_ARTIFACT: '1'

      - name: Verify release Phar asset
        run: test -s task-orchestrator.phar

      - name: Upload Phar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: task-orchestrator.phar
