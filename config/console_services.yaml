services:
  _defaults:
    autowire: true
    autoconfigure: true

  # --- PSR Event Dispatcher ---
  Psr\EventDispatcher\EventDispatcherInterface:
    alias: Symfony\Component\EventDispatcher\EventDispatcher

  Symfony\Component\EventDispatcher\EventDispatcher: ~

  # --- Console-команды и подписчики apps/console ---
  # Auto-discovery каталогов Command/EventSubscriber модулей apps/console
  # выполняется PHAR-safe регистратором ModuleServiceRegistrar (public=true) в
  # Kernel::build(): см. TaskOrchestrator\Common\Kernel::registerConsoleServices().
  # Раньше здесь были три блока `resource:` (apps/console/src/Module/.../Command/*
  # и .../EventSubscriber/*), но Symfony GlobResource не работает по phar:// и
  # ломал сборку PHAR — команды модулей не регистрировались в архиве.
  # Теги `console.command` (для Command) и `kernel.event_subscriber` (для
  # EventSubscriber) добавляются автоматически через container-wide
  # registerForAutoconfiguration из FrameworkExtension.

  # --- Symfony Lock (uses local filesystem) ---
  Symfony\Component\Lock\LockFactory:
    arguments:
      $store: '@Symfony\Component\Lock\Store\FlockStore'

  Symfony\Component\Lock\Store\FlockStore: ~
