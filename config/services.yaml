services:
  _defaults:
    autowire: true
    autoconfigure: true

  # --- Тегирование всех AgentRunnerInterface реализаций ---
  _instanceof:
    TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerInterface:
      tags: ['agent.runner']
    TaskOrchestrator\Common\Module\Orchestrator\Application\Service\Chain\ExecutionStrategyInterface:
      tags: ['orchestrator.execution_strategy']

  # --- Auto-discovery (Application + Infrastructure, Domain исключён) ---
  TaskOrchestrator\Common\:
    resource: '../src/*'
    exclude:
      - '../src/Module/*/Domain/Dto/'
      - '../src/Module/*/Domain/Entity/'
      - '../src/Module/*/Domain/Enum/'
      - '../src/Module/*/Domain/Exception/'
      - '../src/Module/*/Domain/ValueObject/'
      - '../src/DependencyInjection/'
      - '../src/Infrastructure/Symfony/'
      - '../src/Module/AgentRunner/Infrastructure/Service/RetryingAgentRunner.php'
      - '../src/Module/AgentRunner/Infrastructure/Service/CircuitBreakerAgentRunner.php'
      - '../src/Module/AgentRunner/Infrastructure/Service/Codex/Resources/'
      - '../src/Module/SecurityPolicy/Infrastructure/Orchestrator/SecurityPolicyRunAgentDecorator.php'
      - '../src/Module/SecurityPolicy/Infrastructure/Orchestrator/SecurityPolicyExecutionStrategyDecorator.php'

  # --- Integration Service alias (Interface → Implementation by convention service.md) ---
  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Integration\RunAgentServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Integration\Service\AgentRunner\RunAgentService

  # --- Явные alias: Interface → Implementation (по конвенции service.md) ---
  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\Pi\PiAgentRunner

  TaskOrchestrator\Common\Module\Orchestrator\Application\Service\Chain\ChainLoaderInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\YamlChainLoader

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Session\ChainSessionLoggerInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\ChainSessionLogger

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Session\ChainSessionWriterInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\ChainSessionLogger

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Session\ChainSessionReaderInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\ChainSessionLogger

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\FacilitatorResponseParserInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\FacilitatorResponseParserService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Audit\AuditLoggerFactoryInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\JsonlAuditLoggerFactory

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Prompt\PromptProviderInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Prompt\RolePromptBuilder

  # --- Application Service alias ---
  TaskOrchestrator\Common\Module\Orchestrator\Application\Service\ResolveExitCodeServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Application\Service\ResolveExitCodeService

  # --- StaticExecution module: Integration Service aliases ---
  TaskOrchestrator\Common\Module\StaticExecution\Domain\Service\RunAgentServiceInterface:
    alias: TaskOrchestrator\Common\Module\StaticExecution\Integration\Service\AgentRunner\RunAgentService

  TaskOrchestrator\Common\Module\StaticExecution\Domain\Service\FormatPromptServiceInterface:
    alias: TaskOrchestrator\Common\Module\StaticExecution\Integration\Service\Prompt\FormatPromptService

  # --- StaticExecution module: Integration Service aliases ---
  TaskOrchestrator\Common\Module\StaticExecution\Domain\Service\StaticAuditServiceInterface:
    alias: TaskOrchestrator\Common\Module\StaticExecution\Integration\Service\Audit\StaticAuditService

  # --- StaticExecution module: Domain/Infrastructure aliases ---
  TaskOrchestrator\Common\Module\StaticExecution\Application\Service\ExecuteStaticChainServiceInterface:
    alias: TaskOrchestrator\Common\Module\StaticExecution\Application\Service\ExecuteStaticChainService

  TaskOrchestrator\Common\Module\StaticExecution\Domain\Service\QualityGateRunnerInterface:
    alias: TaskOrchestrator\Common\Module\StaticExecution\Infrastructure\Service\QualityGateRunner

  TaskOrchestrator\Common\Module\StaticExecution\Domain\Service\ResolveChainRunnerServiceInterface:
    alias: TaskOrchestrator\Common\Module\StaticExecution\Infrastructure\Service\ResolveChainRunnerService

  TaskOrchestrator\Common\Module\StaticExecution\Domain\Service\CheckStaticBudgetServiceInterface:
    alias: TaskOrchestrator\Common\Module\StaticExecution\Domain\Service\CheckStaticBudgetService

  # --- Infrastructure Service alias ---
  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\RunDynamicLoopAgentServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\RunDynamicLoopAgentService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Budget\CheckDynamicBudgetServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\CheckDynamicBudgetService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Shared\PromptFormatterInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\PromptFormatterService

  # --- ConditionalExecution: Integration Service alias ---
  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\ExecuteConditionalStepServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\ExecuteConditionalStepService

  # --- ConditionalExecution: Domain Service alias ---
  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Condition\EvaluateConditionServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Condition\EvaluateConditionService

  # --- Domain Service alias (auto-discovery covers Domain/Service/) ---
  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\RunDynamicLoopServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\RunDynamicLoopService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\ExecuteDynamicTurnServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\ExecuteDynamicTurnService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\CheckDynamicLoopBudgetServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\CheckDynamicLoopBudgetService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\FinalizeDynamicLoopServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\FinalizeDynamicLoopService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\RecordDynamicRoundServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\RecordDynamicRoundService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\FormatDynamicJournalServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\FormatDynamicJournalService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\BuildDynamicContextServiceInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\BuildDynamicContextService

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Chain\Dynamic\RoundCompletedNotifierInterface:
    alias: TaskOrchestrator\Common\Module\Orchestrator\Application\Service\Chain\DispatchRoundEventService

  # Report format mappers
  TaskOrchestrator\Common\Module\Orchestrator\Application\UseCase\Query\GenerateReport\ReportResultFactory:
    arguments:
      $mappers:
        text: '@TaskOrchestrator\Common\Module\Orchestrator\Application\Mapper\ReportTextMapper'
        json: '@TaskOrchestrator\Common\Module\Orchestrator\Application\Mapper\ReportJsonMapper'

  # --- AgentRunner module services ---
  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerRegistryServiceInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerRegistryService

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\RetryableRunnerFactoryInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\RetryableRunnerFactory

  # --- Registry с tagged iterator ---
  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerRegistryService:
    arguments:
      $runners: !tagged_iterator agent.runner

  # --- CommandHandler: tagged strategies ---
  TaskOrchestrator\Common\Module\Orchestrator\Application\UseCase\Command\OrchestrateChain\OrchestrateChainCommandHandler:
    arguments:
      $strategies: !tagged_iterator orchestrator.execution_strategy

  # --- Параметры путей (через bundle configuration) ---
  TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Prompt\RolePromptBuilder:
    arguments:
      $rolesDir: '%task_orchestrator.roles_dir%'
      $basePath: '%task_orchestrator.base_path%'

  TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\YamlChainLoader:
    arguments:
      $yamlPath: '%task_orchestrator.chains_yaml%'

  TaskOrchestrator\Common\Module\Orchestrator\Infrastructure\Service\Chain\ChainSessionLogger:
    arguments:
      $chainsSessionDir: '%task_orchestrator.chains_session_dir%'
      $basePath: '%task_orchestrator.base_path%'

  # --- SecurityPolicy module: Domain Service aliases ---
  TaskOrchestrator\Common\Module\SecurityPolicy\Domain\Service\ExecPolicyCheckServiceInterface:
    alias: TaskOrchestrator\Common\Module\SecurityPolicy\Domain\Service\ExecPolicyCheckService

  TaskOrchestrator\Common\Module\SecurityPolicy\Domain\Service\SecurityPolicyServiceInterface:
    factory: ['@TaskOrchestrator\Common\Module\SecurityPolicy\Infrastructure\Service\DefaultSecurityPolicyFactory', 'create']

  # --- SecurityPolicy module: YamlExecRuleRepository ---
  TaskOrchestrator\Common\Module\SecurityPolicy\Infrastructure\Persistence\YamlExecRuleRepository:
    arguments:
      $yamlPath: '%kernel.project_dir%/config/security_policy.yaml'

  # --- SecurityPolicy module: Infrastructure Service (ports) aliases ---
  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Security\CheckChainSecurityServiceInterface:
    alias: TaskOrchestrator\Common\Module\SecurityPolicy\Infrastructure\Orchestrator\ChainSecurityPolicy

  TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Security\CheckExecPolicyServiceInterface:
    alias: TaskOrchestrator\Common\Module\SecurityPolicy\Infrastructure\Orchestrator\ExecPolicyCheck

  # --- SecurityPolicy module: Decorators ---
  TaskOrchestrator\Common\Module\SecurityPolicy\Infrastructure\Orchestrator\SecurityPolicyRunAgentDecorator:
    decorates: TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Integration\RunAgentServiceInterface
    decoration_on_invalid: ignore
    decoration_priority: 10
    arguments:
      $decoratedService: '@.inner'
      $execPolicy: '@TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Security\CheckExecPolicyServiceInterface'

  TaskOrchestrator\Common\Module\SecurityPolicy\Infrastructure\Orchestrator\SecurityPolicyExecutionStrategyDecorator:
    decorates: TaskOrchestrator\Common\Module\Orchestrator\Application\Service\Chain\ExecutionStrategyInterface
    decoration_on_invalid: ignore
    decoration_priority: 10
    arguments:
      $decoratedStrategy: '@.inner'
      $chainSecurityPolicy: '@TaskOrchestrator\Common\Module\Orchestrator\Domain\Service\Security\CheckChainSecurityServiceInterface'
