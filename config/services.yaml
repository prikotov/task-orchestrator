# Конфигурация сервисов приложения (Domain/Application/Infrastructure) загружается
# MicroKernelTrait::configureContainer(). Presentation-слой (apps/console — команды,
# Application, EventSubscriber, Lock) вынесен в отдельный файл и подключается здесь,
# чтобы ядро из Kernel.php не зависело от презентационного пакета напрямую.
imports:
    - { resource: console_services.yaml }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # --- PSR-20 Clock (источник времени; реализация в общем Component) ---
  # SystemClock — единственный concrete-сервис каталога src/Component/, который
  # должен быть доступен контейнеру (через alias Psr\Clock\ClockInterface ниже).
  # Остальное содержимое src/Component/ (ModuleSystem: compiler passes, сам
  # регистратор, trait, интерфейсы) — не сервисы: инстанциируются вручную
  # (new / addCompilerPass в Kernel) либо являются interface/trait.
  # PHAR-safe: явное определение вместо прежнего `resource: .../src/Component/*`
  # (Symfony GlobResource возвращает 0 файлов по phar://, ломая сборку PHAR).
  TaskOrchestrator\Common\Component\Clock\SystemClock: ~

  Psr\Clock\ClockInterface:
    alias: TaskOrchestrator\Common\Component\Clock\SystemClock

  # --- Локаль AI-ролей (env TASK_ORCHESTRATOR_LOCALE) ---
  # Env-процессор prefix `task_orchestrator_locale`: нормализует
  # TASK_ORCHESTRATOR_LOCALE (default `en`, trim, lower-case) в runtime для
  # динамического параметра task_orchestrator.locale (Kernel::getKernelParameters()).
  # Потребители — модули AgentRole и ChainExecution; смена локали применяется
  # без пересборки кеша контейнера. Тег только маркирует процессор: префикс
  # объявляется в самом классе (getProvidedTypes()).
  TaskOrchestrator\Common\Component\Locale\TaskOrchestratorLocaleEnvVarProcessor:
    tags:
      - { name: container.env_var_processor }

  # --- Runtime phar-зависимые пути ядра (package_dir / phar_path) ---
  # Env-процессор prefix `task_orchestrator_phar` (Component/PharRuntime):
  # разрешает параметры ядра task_orchestrator.package_dir/phar_path В МОМЕНТ
  # обращения, а не при компиляции (шаг (A) решения П2): значения НЕ запекаются
  # в скомпилированный контейнер, поэтому после перемещения PHAR потребители
  # (layout-резолвер package-fallback, привязка .phar-binding команды agent:init)
  # получают пути от ЗАПУЩЕННОГО архива даже при переиспользовании персистентного
  # кеша контейнера в debug=false — без очистки кеша и без мёртвых phar://-ссылок.
  # Источник значений — провайдер путей запущенного кода (alias на `kernel`:
  # packageDir() — location-based, runningPharPath() — защищённый шов
  # resolvePharPath()). Тег только маркирует процессор: префикс объявлен в самом
  # классе (getProvidedTypes()).
  # ❗ Аргументы процессора — ТОЛЬКО plain-параметры контейнера либо сервисы БЕЗ
  # env-зависимостей: %env(...)% в аргументах env-процессора запрещён — рекурсия
  # Container::getEnv() (см. PHPDoc класса). По этой же причине
  # TaskOrchestratorLayoutEnvVarProcessor ниже получает package-корень через
  # провайдер, а не через %task_orchestrator.package_dir% (тот стал
  # env-плейсхолдером).
  TaskOrchestrator\Common\Component\PharRuntime\PharRuntimePathsProviderInterface:
    alias: kernel

  TaskOrchestrator\Common\Component\PharRuntime\TaskOrchestratorPharEnvVarProcessor:
    arguments:
      $pathsProvider: '@TaskOrchestrator\Common\Component\PharRuntime\PharRuntimePathsProviderInterface'
    tags:
      - { name: container.env_var_processor }

  # --- Runtime layout host/package (roles_dir / skills_dir / chains_yaml) ---
  # Env-процессор prefix `task_orchestrator_layout` (Component/Layout): выбирает
  # host- или package-путь ресурса при каждом запуске (Container::getEnv в
  # runtime через чистый HostPackageLayoutResolver), поэтому layout-ресурсы
  # host-проекта, созданные после первого запуска PHAR, доступны на следующем
  # запуске БЕЗ очистки кеша (QA-3); при отсутствии обоих кандидатов — явное
  # исключение. Потребители — модули AgentRole, ChainDefinition и ChainExecution
  # (через %task_orchestrator.roles_dir% и др.).
  # ❗ Аргументы процессора — ТОЛЬКО plain-параметры контейнера (base_path) и
  # сервисы БЕЗ env-зависимостей: %env(...)% в аргументах env-процессора
  # запрещён — рекурсия Container::getEnv() (см. PHPDoc класса). Package-корень
  # берётся у провайдера Component/PharRuntime (alias на `kernel`) в runtime,
  # а НЕ параметром %task_orchestrator.package_dir% — тот стал env-плейсхолдером
  # и в аргументах env-процессора запрещён. Тег только маркирует процессор:
  # префикс объявлен в самом классе (getProvidedTypes()).
  TaskOrchestrator\Common\Component\Layout\TaskOrchestratorLayoutEnvVarProcessor:
    arguments:
      $hostRoot: '%task_orchestrator.base_path%'
      $pathsProvider: '@TaskOrchestrator\Common\Component\PharRuntime\PharRuntimePathsProviderInterface'
    tags:
      - { name: container.env_var_processor }

  # --- Use Case шины (CommandBus/QueryBus) ---
  # PHAR-safe: явные определения (без resource:). Аргумент $handlers (PSR-11
  # локатор «класс сообщения => сервис хендлера») проставляет UseCaseBusCompilerPass
  # по факту зарегистрированных Use Case Handler-ов — ручная конфигурация не нужна.
  TaskOrchestrator\Common\Component\CommandBus\CommandBus: ~

  TaskOrchestrator\Common\Component\CommandBus\CommandBusComponentInterface:
    alias: TaskOrchestrator\Common\Component\CommandBus\CommandBus
    public: true

  TaskOrchestrator\Common\Component\QueryBus\QueryBus: ~

  TaskOrchestrator\Common\Component\QueryBus\QueryBusComponentInterface:
    alias: TaskOrchestrator\Common\Component\QueryBus\QueryBus
    public: true

  # --- agent:init: установка task-orchestrator в host-проекте ---
  # Специализированный Presentation-сервис установки общего skill become-role
  # (см. TaskOrchestrator\Console\Module\Orchestrator\Skill). source/Composer —
  # относительный симлинк; PHAR — управляемая копия с runtime-привязкой
  # .phar-binding к физическому пути запущенного PHAR. Phar-зависимые пути
  # (package-корень, физический путь PHAR) резолвятся в runtime через провайдер
  # Component/PharRuntime (alias на `kernel`) — не замораживаются в кеш
  # контейнера (шаг (A) решения П2); не phar-зависимые (base_path/is_phar) —
  # plain-параметры ядра. Filesystem резолвится через FrameworkBundle. Сама
  # команда InitCommand регистрируется PHAR-safe регистратором
  # Kernel::registerConsoleServices() и получает сервис через явный alias ниже
  # (autowire).
  TaskOrchestrator\Console\Module\Orchestrator\Skill\Service\InstallBecomeRoleService:
    arguments:
      $pathsProvider: '@TaskOrchestrator\Common\Component\PharRuntime\PharRuntimePathsProviderInterface'
      $basePath: '%task_orchestrator.base_path%'
      $isPhar: '%task_orchestrator.is_phar%'

  TaskOrchestrator\Console\Module\Orchestrator\Skill\InstallBecomeRoleServiceInterface:
    alias: TaskOrchestrator\Console\Module\Orchestrator\Skill\Service\InstallBecomeRoleService
