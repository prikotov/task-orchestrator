services:
  _defaults:
    autowire: true
    autoconfigure: true

  # --- Тегирование всех AgentRunnerInterface реализаций ---
  _instanceof:
    TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerInterface:
      tags: ['agent.runner']
    TaskOrchestrator\Common\Module\ChainExecution\Application\Contract\Chain\ExecutionStrategyInterface:
      tags: ['orchestrator.execution_strategy']
    TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\ExecuteStepServiceInterface:
      tags: ['chain_execution.step_runner']

  # --- Auto-discovery (Application + Infrastructure, Domain исключён) ---
  TaskOrchestrator\Common\:
    resource: '../src/*'
    exclude:
      - '../src/Module/*/Domain/Dto/'
      - '../src/Module/*/Domain/Entity/'
      - '../src/Module/*/Domain/Enum/'
      - '../src/Module/*/Domain/Exception/'
      - '../src/Module/*/Domain/ValueObject/'
      - '../src/DependencyInjection/'
      - '../src/Module/AgentRunner/Infrastructure/Service/RetryingAgentRunnerService.php'
      - '../src/Module/AgentRunner/Infrastructure/Service/CircuitBreakerAgentRunnerService.php'
      - '../src/Module/AgentRunner/Infrastructure/Service/Codex/Resources/'

  # ─── DynamicLoop module ─────────────────────────────────────────────

  # Domain Service aliases
  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\RunDynamicLoopServiceInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\RunDynamicLoopService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\ExecuteDynamicTurnServiceInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\ExecuteDynamicTurnService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\CheckDynamicLoopBudgetServiceInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\CheckDynamicLoopBudgetService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\FinalizeDynamicLoopServiceInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\FinalizeDynamicLoopService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\RecordDynamicRoundServiceInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\RecordDynamicRoundService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\FormatDynamicJournalServiceInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\FormatDynamicJournalService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\BuildDynamicContextServiceInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\BuildDynamicContextService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\RoundCompletedNotifierInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Integration\Service\ChainExecution\DispatchRoundEventService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\RunDynamicLoopAgentServiceInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Integration\Service\ChainExecution\RunDynamicLoopAgentService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Dynamic\FacilitatorResponseParserInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Infrastructure\Service\FacilitatorResponseParserService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Budget\CheckDynamicLoopBudgetServiceInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Infrastructure\Service\CheckDynamicBudgetService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Shared\DynamicLoopPromptFormatterInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Infrastructure\Service\PromptFormatterService

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Audit\DynamicLoopAuditLoggerFactoryInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Infrastructure\Service\JsonlAuditLoggerFactory

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Session\DynamicLoopSessionLoggerInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Infrastructure\Service\ChainSessionLogger

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Session\DynamicLoopSessionWriterInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Infrastructure\Service\ChainSessionLogger

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Session\DynamicLoopSessionReaderInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Infrastructure\Service\ChainSessionLogger

  TaskOrchestrator\Common\Module\DynamicLoop\Integration\Service\ChainExecution\DynamicExecutionStrategy:
    tags: ['orchestrator.execution_strategy']

  TaskOrchestrator\Common\Module\DynamicLoop\Domain\Service\Integration\ChainDefinitionProviderInterface:
    alias: TaskOrchestrator\Common\Module\DynamicLoop\Integration\Service\ChainDefinition\DynamicLoopDefinitionMapperService

  # Infrastructure Service parameters
  TaskOrchestrator\Common\Module\DynamicLoop\Infrastructure\Service\ChainSessionLogger:
    arguments:
      $chainsSessionDir: '%task_orchestrator.chains_session_dir%'
      $basePath: '%task_orchestrator.base_path%'

  # ─── ChainDefinition module ─────────────────────────────────────────

  # Integration Service alias (Interface → Implementation)
  TaskOrchestrator\Common\Module\ChainDefinition\Domain\Service\Chain\ChainLoaderInterface:
    alias: TaskOrchestrator\Common\Module\ChainDefinition\Infrastructure\Service\Chain\YamlChainLoaderService

  TaskOrchestrator\Common\Module\ChainDefinition\Domain\Service\Chain\YamlChainLoaderServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainDefinition\Infrastructure\Service\Chain\YamlChainLoaderService

  TaskOrchestrator\Common\Module\ChainDefinition\Domain\Service\Integration\ConnectivityRoleTargetProviderInterface:
    alias: TaskOrchestrator\Common\Module\ChainDefinition\Infrastructure\Service\Connectivity\YamlConnectivityRoleTargetProviderService

  TaskOrchestrator\Common\Module\ChainDefinition\Domain\Service\Integration\ConnectivityCommandResolverInterface:
    alias: TaskOrchestrator\Common\Module\ChainDefinition\Infrastructure\Service\Connectivity\ProductionLikeConnectivityCommandResolverService

  TaskOrchestrator\Common\Module\ChainDefinition\Domain\Service\Integration\ConnectivityProcessRunnerInterface:
    alias: TaskOrchestrator\Common\Module\ChainDefinition\Infrastructure\Service\Connectivity\SymfonyConnectivityProcessRunnerService

  # Parameters
  TaskOrchestrator\Common\Module\ChainDefinition\Infrastructure\Service\Chain\YamlChainLoaderService:
    arguments:
      $yamlPath: '%task_orchestrator.chains_yaml%'

  TaskOrchestrator\Common\Module\ChainDefinition\Infrastructure\Service\Connectivity\YamlConnectivityRoleTargetProviderService:
    arguments:
      $yamlPath: '%task_orchestrator.chains_yaml%'

  TaskOrchestrator\Common\Module\ChainDefinition\Infrastructure\Service\Connectivity\SymfonyConnectivityProcessRunnerService:
    arguments:
      $basePath: '%task_orchestrator.base_path%'

  # ─── ChainExecution module ───────────────────────────────────────────

  # Domain Service aliases
  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Agent\RunAgentServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Integration\Service\AgentRunner\RunAgentService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Prompt\PromptProviderInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Prompt\RolePromptBuilderService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Prompt\RolePromptBuilderServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Prompt\RolePromptBuilderService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Chain\Audit\AuditLoggerInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Audit\JsonlAuditLoggerService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Chain\Audit\JsonlAuditLoggerServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Audit\JsonlAuditLoggerService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Chain\Shared\PromptFormatterInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Chain\PromptFormatterService


  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\ExecuteConditionalStepServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Chain\ExecuteConditionalStepService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Chain\Hook\HookExecutorInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Chain\Hook\ShellHookExecutorService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Chain\Hook\ShellHookExecutorServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Chain\Hook\ShellHookExecutorService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Condition\EvaluateConditionServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Condition\EvaluateConditionService

  # Static services (from merged StaticExecution module)
  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\FormatPromptServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Integration\Service\Prompt\FormatPromptService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\StaticAuditServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Integration\Service\Audit\StaticAuditService

  TaskOrchestrator\Common\Module\ChainExecution\Application\Service\ExecuteStaticChainServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Application\Service\ExecuteStaticChainService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\QualityGateRunnerInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\QualityGate\QualityGateRunnerService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\QualityGateRunnerServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\QualityGate\QualityGateRunnerService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\ToolStepRunnerInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\ToolStep\ToolStepRunnerService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\ToolStepRunnerServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\ToolStep\ToolStepRunnerService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\ResolveChainRunnerServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Agent\ResolveChainRunnerService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\RunStaticChainServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\RunStaticChainService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\CheckStaticBudgetServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\CheckStaticBudgetService

  # Step runner strategies (tagged)
  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\ResolveStepRunnerServiceInterface:
    alias: TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\ResolveStepRunnerService

  TaskOrchestrator\Common\Module\ChainExecution\Domain\Service\Static\ResolveStepRunnerService:
    arguments:
      $runners: !tagged_iterator chain_execution.step_runner

  # Report format mappers
  TaskOrchestrator\Common\Module\ChainExecution\Application\UseCase\Query\GenerateReport\ReportResultFactory:
    arguments:
      $mappers:
        text: '@TaskOrchestrator\Common\Module\ChainExecution\Application\Mapper\ReportTextMapper'
        json: '@TaskOrchestrator\Common\Module\ChainExecution\Application\Mapper\ReportJsonMapper'

  # Parameters
  TaskOrchestrator\Common\Module\ChainExecution\Infrastructure\Service\Prompt\RolePromptBuilderService:
    arguments:
      $rolesDir: '%task_orchestrator.roles_dir%'
      $basePath: '%task_orchestrator.base_path%'

  # ─── AgentRunner module ─────────────────────────────────────────────

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\Pi\PiAgentRunnerService

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\PiAgentRunnerServiceInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\Pi\PiAgentRunnerService

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerRegistryServiceInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerRegistryService

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\MetricsCollectorInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\Metrics\InMemoryMetricsCollectorService

  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\RetryableRunnerFactoryInterface:
    alias: TaskOrchestrator\Common\Module\AgentRunner\Infrastructure\Service\RetryableRunnerFactory

  # Registry с tagged iterator
  TaskOrchestrator\Common\Module\AgentRunner\Domain\Service\AgentRunnerRegistryService:
    arguments:
      $runners: !tagged_iterator agent.runner

  # ─── CommandHandler: tagged strategies ──────────────────────────────

  TaskOrchestrator\Common\Module\ChainExecution\Application\UseCase\Command\OrchestrateChain\OrchestrateChainCommandHandler:
    arguments:
      $strategies: !tagged_iterator orchestrator.execution_strategy
