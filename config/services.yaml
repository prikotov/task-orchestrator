# Конфигурация сервисов приложения (Domain/Application/Infrastructure) загружается
# MicroKernelTrait::configureContainer(). Presentation-слой (apps/console — команды,
# Application, EventSubscriber, Lock) вынесен в отдельный файл и подключается здесь,
# чтобы ядро из Kernel.php не зависело от презентационного пакета напрямую.
imports:
    - { resource: console_services.yaml }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # --- PSR-20 Clock (источник времени; реализация в общем Component) ---
  # SystemClock — единственный concrete-сервис каталога src/Component/, который
  # должен быть доступен контейнеру (через alias Psr\Clock\ClockInterface ниже).
  # Остальное содержимое src/Component/ (ModuleSystem: compiler passes, сам
  # регистратор, trait, интерфейсы) — не сервисы: инстанциируются вручную
  # (new / addCompilerPass в Kernel) либо являются interface/trait.
  # PHAR-safe: явное определение вместо прежнего `resource: .../src/Component/*`
  # (Symfony GlobResource возвращает 0 файлов по phar://, ломая сборку PHAR).
  TaskOrchestrator\Common\Component\Clock\SystemClock: ~

  Psr\Clock\ClockInterface:
    alias: TaskOrchestrator\Common\Component\Clock\SystemClock

  # --- Локаль AI-ролей (env TASK_ORCHESTRATOR_LOCALE) ---
  # Env-процессор prefix `task_orchestrator_locale`: нормализует
  # TASK_ORCHESTRATOR_LOCALE (default `en`, trim, lower-case) в runtime для
  # динамического параметра task_orchestrator.locale (Kernel::getKernelParameters()).
  # Потребители — модули AgentRole и ChainExecution; смена локали применяется
  # без пересборки кеша контейнера. Тег только маркирует процессор: префикс
  # объявляется в самом классе (getProvidedTypes()).
  TaskOrchestrator\Common\Component\Locale\TaskOrchestratorLocaleEnvVarProcessor:
    tags:
      - { name: container.env_var_processor }

  # --- Use Case шины (CommandBus/QueryBus) ---
  # PHAR-safe: явные определения (без resource:). Аргумент $handlers (PSR-11
  # локатор «класс сообщения => сервис хендлера») проставляет UseCaseBusCompilerPass
  # по факту зарегистрированных Use Case Handler-ов — ручная конфигурация не нужна.
  TaskOrchestrator\Common\Component\CommandBus\CommandBus: ~

  TaskOrchestrator\Common\Component\CommandBus\CommandBusComponentInterface:
    alias: TaskOrchestrator\Common\Component\CommandBus\CommandBus
    public: true

  TaskOrchestrator\Common\Component\QueryBus\QueryBus: ~

  TaskOrchestrator\Common\Component\QueryBus\QueryBusComponentInterface:
    alias: TaskOrchestrator\Common\Component\QueryBus\QueryBus
    public: true

  # --- agent:init: установка task-orchestrator в host-проекте ---
  # Специализированный Presentation-сервис установки общего skill become-role
  # (см. TaskOrchestrator\Console\Module\Orchestrator\Skill). source/Composer —
  # относительный симлинк; PHAR — управляемая копия с runtime-привязкой
  # .phar-binding к физическому пути запущенного PHAR. Параметры ядра
  # (package_dir/base_path/is_phar/phar_path) — единственный источник путей;
  # Filesystem резолвится через FrameworkBundle. Сама команда InitCommand
  # регистрируется PHAR-safe регистратором Kernel::registerConsoleServices()
  # и получает сервис через явный alias ниже (autowire).
  TaskOrchestrator\Console\Module\Orchestrator\Skill\Service\InstallBecomeRoleService:
    arguments:
      $packageDir: '%task_orchestrator.package_dir%'
      $basePath: '%task_orchestrator.base_path%'
      $isPhar: '%task_orchestrator.is_phar%'
      $pharPath: '%task_orchestrator.phar_path%'

  TaskOrchestrator\Console\Module\Orchestrator\Skill\InstallBecomeRoleServiceInterface:
    alias: TaskOrchestrator\Console\Module\Orchestrator\Skill\Service\InstallBecomeRoleService
