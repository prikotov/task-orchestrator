# Конфигурация сервисов приложения (Domain/Application/Infrastructure) загружается
# MicroKernelTrait::configureContainer(). Presentation-слой (apps/console — команды,
# Application, EventSubscriber, Lock) вынесен в отдельный файл и подключается здесь,
# чтобы ядро из Kernel.php не зависело от презентационного пакета напрямую.
imports:
    - { resource: console_services.yaml }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # --- PSR-20 Clock (источник времени; реализация в общем Component) ---
  # SystemClock — единственный concrete-сервис каталога src/Component/, который
  # должен быть доступен контейнеру (через alias Psr\Clock\ClockInterface ниже).
  # Остальное содержимое src/Component/ (ModuleSystem: compiler passes, сам
  # регистратор, trait, интерфейсы) — не сервисы: инстанциируются вручную
  # (new / addCompilerPass в Kernel) либо являются interface/trait.
  # PHAR-safe: явное определение вместо прежнего `resource: .../src/Component/*`
  # (Symfony GlobResource возвращает 0 файлов по phar://, ломая сборку PHAR).
  TaskOrchestrator\Common\Component\Clock\SystemClock: ~

  Psr\Clock\ClockInterface:
    alias: TaskOrchestrator\Common\Component\Clock\SystemClock

  # --- agent:init: установка task-orchestrator в host-проекте ---
  # Команде нужны корневые параметры package_dir/base_path (аутовайринг строковых
  # аргументов требует явного binding). Filesystem резолвится через FrameworkBundle.
  TaskOrchestrator\Console\Module\Orchestrator\Command\InitCommand:
    arguments:
      $packageDir: '%task_orchestrator.package_dir%'
      $basePath: '%task_orchestrator.base_path%'
