# Конфигурация переводов (минимальная).
#
# Модули, реализующие TranslationInterface, добавляют свои каталоги переводов
# через ModuleKernelTrait (prepend-extension-config translator.paths).
#
# framework.default_locale — стандартная локаль Symfony-переводчика собственного
# ядра task-orchestrator. Она НЕ зависит от TASK_ORCHESTRATOR_LOCALE (локали
# AI-ролей: role files + каталог skills) и от APP_LOCALE host-проекта: локаль
# AI-ролей и локаль Symfony-переводчика — независимые контракты. При
# необходимости настраивается отдельно штатными средствами Symfony, без влияния
# на выбор role files.

framework:
    default_locale: en
    translator:
        fallbacks: ['en']
