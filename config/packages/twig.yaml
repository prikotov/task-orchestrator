# Конфигурация Twig (минимальная).
#
# Базовый каталог шаблонов приложения. Модули, реализующие TwigInterface,
# регистрируют свои пути отдельно через TwigCompilerPass. Если каталог
# templates/ отсутствует, Twig не падает до момента фактического рендера.
twig:
    default_path: '%kernel.project_dir%/templates'
